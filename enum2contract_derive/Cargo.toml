[package]
name = "enum2contract_derive"
version = "0.3.0"
authors = ["Matthew Berger <matthewjordanberger@gmail.com>"]
description = "Derive macro implementation for enum2contract."
homepage = "https://github.com/matthewjberger/enum2contract"
repository = "https://github.com/matthewjberger/enum2contract"
documentation = "https://docs.rs/enum2contract_derive"
keywords = ["enum", "macro", "contract"]
categories = ["development-tools::procedural-macro-helpers"]
license = "MIT"
edition = "2024"
rust-version = "1.95"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"
